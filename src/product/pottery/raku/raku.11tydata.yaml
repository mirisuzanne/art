title: Raku vase
clay: bmx
safety: >
  Raku firing provides beautiful variation,
  but not a water-tight or food-safe finish.
  These pieces can hold water
  similar to a terra-cotta flower pot,
  with some moisture seeping out the base.
  Recommended for dry arrangements,
  or with a tray underneath.

